services:
  - type: web
    name: sportsintelai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: USE_SAMPLE_DATA
        value: "false"
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: FOOTBALL_DATA_BASE_URL
        value: https://api.football-data.org/v4
      - key: FOOTBALL_DATA_COMPETITION
        value: WC
      - key: DATABASE_PATH
        value: /var/data/fifa2026.db
      - key: MODEL_PATH
        value: models/pl_model.pkl
      - key: BOOTSTRAP_LEAGUE_DATA
        value: "true"
      - key: ENABLE_LEAGUE_SCHEDULER
        value: "true"
      - key: LEAGUE_SCHEDULE_HOURS_UTC
        value: "8,20"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    disk:
      name: fifa2026-data
      mountPath: /var/data
      sizeGB: 1
